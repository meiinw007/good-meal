workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.35.7
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Generate Android platform files
        script: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --project-name good_meal --org com.goodmeal .
          cp /tmp/main.dart lib/main.dart
          rm -f test/widget_test.dart
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
